name: Flutter APK Builder
run-name: Build ${{ inputs.build_type }} - ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "GitHub API URL untuk ZIP project yang diunggah bot"
        required: true
        type: string
      tag:
        description: "ID build yang dikirim oleh bot"
        required: true
        type: string
      build_type:
        description: "Jenis APK yang dibuat"
        required: true
        type: choice
        options:
          - debug
          - release
      only_analyze:
        description: "Hanya menjalankan flutter analyze"
        required: true
        type: choice
        options:
          - "false"
          - "true"
        default: "false"

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v6

      - name: Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.9"

      - name: Download and extract project ZIP
        shell: bash
        env:
          ZIP_URL: ${{ inputs.zip_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ -z "${ZIP_URL:-}" ]]; then
            echo "ERROR: input zip_url kosong."
            exit 1
          fi

          mkdir -p source
          curl --fail --show-error --location \
            --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 300 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/octet-stream" \
            "${ZIP_URL}" -o project.zip

          if [[ ! -s project.zip ]]; then
            echo "ERROR: ZIP project kosong atau gagal diunduh."
            exit 1
          fi

          unzip -t project.zip
          unzip -q project.zip -d source

          PUBSPEC_PATH="$(find source -type f -name pubspec.yaml -not -path '*/.dart_tool/*' -print -quit)"
          if [[ -z "${PUBSPEC_PATH}" ]]; then
            echo "ERROR: pubspec.yaml tidak ditemukan. Pastikan ZIP berisi project Flutter lengkap."
            echo "Isi ZIP harus memiliki pubspec.yaml dan folder lib/."
            exit 1
          fi

          PROJECT_DIR="$(dirname "${PUBSPEC_PATH}")"
          if [[ ! -d "${PROJECT_DIR}/lib" ]]; then
            echo "ERROR: folder lib/ tidak ditemukan bersama pubspec.yaml."
            exit 1
          fi

          if [[ ! -d "${PROJECT_DIR}/android" ]]; then
            echo "ERROR: folder android/ tidak ditemukan. Project mungkin belum memiliki platform Android."
            exit 1
          fi

          # ZIP dari Windows/Android kadang tidak menyimpan permission executable.
          if [[ -f "${PROJECT_DIR}/android/gradlew" ]]; then
            chmod +x "${PROJECT_DIR}/android/gradlew"
          fi

          echo "PROJECT_DIR=${PROJECT_DIR}" >> "${GITHUB_ENV}"
          echo "Project Flutter ditemukan di: ${PROJECT_DIR}"

      - name: Install Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"
          flutter --version
          flutter pub get

      - name: Analyze project (analyze-only mode)
        if: ${{ inputs.only_analyze == 'true' }}
        shell: bash
        run: |
          set -u
          cd "${PROJECT_DIR}"
          echo "[RESULT_ANALYZE]"
          set +e
          flutter analyze 2>&1
          ANALYZE_STATUS=$?
          set -e
          echo "Flutter analyze exit code: ${ANALYZE_STATUS}"
          echo "[END_RESULT_ANALYZE]"
          # Jangan gagalkan workflow hanya karena analyzer menemukan warning/error.
          # Bot membaca output di antara marker di atas.
          exit 0

      - name: Build APK
        if: ${{ inputs.only_analyze != 'true' }}
        shell: bash
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -euo pipefail
          cd "${PROJECT_DIR}"

          case "${BUILD_TYPE}" in
            debug)
              flutter build apk --debug
              ;;
            release)
              flutter build apk --release
              ;;
            *)
              echo "ERROR: build_type harus debug atau release."
              exit 1
              ;;
          esac

      - name: Upload APK artifact
        if: ${{ inputs.only_analyze != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ inputs.build_type }}-${{ inputs.tag }}
          path: source/**/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 1
